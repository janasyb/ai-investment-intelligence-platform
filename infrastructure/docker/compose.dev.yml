services:
  postgres:
    image: postgres:16-alpine
    container_name: aiip-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: aiip
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - aiip_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d aiip"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: aiip-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - aiip_redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  api:
    build:
      context: ../../apps/api
      dockerfile: Dockerfile
    container_name: aiip-api
    restart: unless-stopped
    environment:
      APP_NAME: "AI Investment Intelligence Platform"
      APP_VERSION: "0.1.0-alpha"
      ENVIRONMENT: development
      DEBUG: "true"
      HOST: "0.0.0.0"
      PORT: "8000"
      LOG_LEVEL: INFO
      DATABASE_URL: "postgresql+psycopg://postgres:postgres@postgres:5432/aiip"
      REDIS_URL: "redis://redis:6379/0"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=3)"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

volumes:
  aiip_postgres_data:
  aiip_redis_data: